<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validador de Productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">✓</span>
      <div>
        <h1>Validador de Productos Digitales</h1>
        <p class="sub">Ebooks · guías PDF · plantillas · low ticket (hasta USD 30)</p>
        <p class="sync" id="syncStatus" data-kind="local" aria-live="polite">Guardado en este navegador</p>
      </div>
    </div>
    <div class="project-bar">
      <select id="projectSelect" aria-label="Proyecto"></select>
      <button id="newProject" class="btn">+ Nuevo</button>
      <button id="renameProject" class="btn ghost">Renombrar</button>
      <button id="deleteProject" class="btn ghost danger">Borrar</button>
      <button id="exportData" class="btn ghost">Exportar</button>
      <label class="btn ghost file">Importar<input type="file" id="importData" accept="application/json" hidden></label>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="view"></main>

  <footer class="foot">Exportá el JSON cada tanto para tener una copia de respaldo.</footer>

  <script src="app.js"></script>
</body>
</html>
